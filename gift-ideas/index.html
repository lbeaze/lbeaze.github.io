<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift ideas</title>
<meta name="description" content="Gift ideas by person, with price ranges and shopping links.">
<meta name="color-scheme" content="light dark">
<script>
/* Apply a saved theme choice before first paint. No saved choice = follow the system. */
(function () {
  try {
    var t = localStorage.getItem("gift-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  color-scheme:light;
  --bg:#f8f6ef;--band:#eeeae0;--fg:#24211f;--muted:#5e5a55;--line:#d5d0c6;
  --card:#f8f6ef;--img:#ddd8cd;--img-icon:#6f6a62;
  --track:#dad5ca;--tab-on:#ffffff;--tab-off:#4f4b46;
  --accent:#6046d7;--squiggle:#ed725d;--mark:#f4d03f;--mark-fg:#24211f;
  --btn:#24211f;--btn-fg:#ffffff;--btn-line:#8a847a;
  --foot:#6046d7;--foot-fg:#ffffff;--foot-muted:#e4defc;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#171513;--band:#1f1c19;--fg:#f1ede4;--muted:#b9b3a9;--line:#3d3832;
  --card:#26221e;--img:#332e29;--img-icon:#a39c91;
  --track:#2d2925;--tab-on:#4a433b;--tab-off:#c9c3b9;
  --accent:#b5a6ff;--squiggle:#f08a77;--mark:#f4d03f;--mark-fg:#24211f;
  --btn:#f1ede4;--btn-fg:#171513;--btn-line:#8d867b;
  --foot:#2c2163;--foot-fg:#ffffff;--foot-muted:#d5cdfa;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171513;--band:#1f1c19;--fg:#f1ede4;--muted:#b9b3a9;--line:#3d3832;
  --card:#26221e;--img:#332e29;--img-icon:#a39c91;
  --track:#2d2925;--tab-on:#4a433b;--tab-off:#c9c3b9;
  --accent:#b5a6ff;--squiggle:#f08a77;--mark:#f4d03f;--mark-fg:#24211f;
  --btn:#f1ede4;--btn-fg:#171513;--btn-line:#8d867b;
  --foot:#2c2163;--foot-fg:#ffffff;--foot-muted:#d5cdfa;
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:100%;scroll-behavior:smooth}
body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);
  font:1rem/1.6 "DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  text-rendering:optimizeLegibility;overflow-wrap:break-word}
::selection{background:var(--mark);color:var(--mark-fg)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:fixed;left:1rem;top:1rem;z-index:50;transform:translateY(-6rem);background:var(--btn);color:var(--btn-fg);
  padding:.75rem 1.25rem;border-radius:999px;font-weight:700;text-decoration:none;transition:transform .15s}
.skip:focus{transform:none}
.inner{max-width:83.25rem;margin:0 auto}
.pad{padding-left:1.25rem;padding-right:1.25rem}
@media (min-width:40rem){.pad{padding-left:2rem;padding-right:2rem}}
@media (min-width:64rem){.pad{padding-left:3.5rem;padding-right:3.5rem}}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:.75rem 1.5rem;padding-top:1.25rem;padding-bottom:1.25rem}
.theme{display:flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:500;color:var(--muted)}
.theme select{font:inherit;font-weight:700;color:var(--fg);background:var(--card);border:1px solid var(--btn-line);border-radius:.75rem;
  min-height:2.75rem;padding:0 .75rem;cursor:pointer}

/* Hero */
.hero{display:grid;gap:2rem;padding-top:2.5rem;padding-bottom:3rem}
@media (min-width:64rem){.hero{grid-template-columns:1fr 18rem;align-items:end;padding-top:4rem;padding-bottom:4rem}}
h1{margin:0;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(3.2rem,8vw,7.2rem);line-height:.9;letter-spacing:-.05em}
h1 em{position:relative;display:inline-block;color:var(--accent)}
h1 em svg{position:absolute;left:0;bottom:-.75rem;width:100%;height:1rem;color:var(--squiggle)}
.lede{max-width:24rem;margin:0;color:var(--muted);line-height:1.75}

/* List section */
.lists{background:var(--band);border-top:1px solid var(--line);padding-top:2.5rem;padding-bottom:3rem}
.lists-head{margin-bottom:2rem}
.kicker{margin:0 0 .5rem;font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h2{margin:0;font-size:clamp(1.875rem,4vw,2.25rem);font-weight:800;letter-spacing:-.04em;line-height:1.15}
[role="tablist"]{margin-top:2.75rem;display:flex;flex-wrap:wrap;gap:.25rem;padding:.375rem;border-radius:1rem;background:var(--track);width:fit-content;max-width:100%}
[role="tab"]{font:inherit;font-size:.875rem;font-weight:700;min-height:2.75rem;padding:0 1.25rem;border:0;border-radius:.75rem;
  background:transparent;color:var(--tab-off);cursor:pointer;-webkit-tap-highlight-color:transparent}
[role="tab"]:hover{color:var(--fg)}
[role="tab"][aria-selected="true"]{background:var(--tab-on);color:var(--fg);box-shadow:inset 0 0 0 2px var(--fg)}
[role="tabpanel"][hidden]{display:none}
.grid{display:grid;gap:1.25rem;list-style:none;margin:0;padding:0;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr))}
.empty{color:var(--muted)}

/* Card */
.card{position:relative;display:flex;flex-direction:column;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:1.5rem;background:var(--card);transition:transform .3s}
.card:hover{transform:translateY(-.25rem)}
.media{order:-1;position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--img);display:grid;place-items:center}
.media.has-img{background:#fff}
.media img{width:100%;height:100%;object-fit:contain;padding:1rem;display:block}
.media .ph{width:3rem;height:3rem;color:var(--img-icon)}
.price{z-index:1;margin:0;position:absolute;left:1rem;top:1rem;padding:.375rem .75rem;border-radius:999px;background:var(--bg);color:var(--fg);font-size:.8125rem;font-weight:800;line-height:1.2}
.body{display:flex;flex-direction:column;flex:1;padding:1.25rem}
h3{margin:0;font-size:1.25rem;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.note{margin:.25rem 0 0;font-size:.875rem;color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.5rem;margin-top:auto;padding-top:1.25rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;padding:.25rem .75rem;border-radius:.75rem;
  font-size:.875rem;font-weight:700;text-decoration:none;text-align:center;border:1px solid var(--btn);transition:background-color .15s,color .15s,border-color .15s}
.btn svg{width:1rem;height:1rem;flex:none}
.btn-solid{background:var(--btn);color:var(--btn-fg)}
.btn-solid:hover{background:var(--accent);border-color:var(--accent)}
.btn-line{border-color:var(--btn-line)}
.btn-line:hover{border-color:var(--accent);color:var(--accent)}
.fine{max-width:42rem;margin:1.75rem 0 0;font-size:.8125rem;color:var(--muted)}

/* Footer */
footer{background:var(--foot);color:var(--foot-fg);padding-top:2.5rem;padding-bottom:2.5rem}
.foot{display:flex;flex-direction:column;gap:1.5rem}
@media (min-width:40rem){.foot{flex-direction:row;align-items:center;justify-content:space-between}}
.foot p{margin:0}
.foot .big{font-family:"DM Serif Display",Georgia,serif;font-style:italic;font-size:1.875rem;line-height:1.2}
.foot .small{margin-top:.25rem;font-size:.875rem;color:var(--foot-muted)}
.toplink{width:fit-content;display:inline-flex;align-items:center;min-height:2.75rem;padding:0 1.25rem;border:1px solid var(--foot-muted);border-radius:999px;
  font-size:.875rem;font-weight:700;text-decoration:none}
.toplink:hover{background:var(--foot-fg);color:var(--foot)}
footer :focus-visible{outline-color:var(--foot-fg)}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .card:hover{transform:none}
}
</style>
</head>

  </section>
</main>

  </div>
</footer>

       https://lenbeasley.com/gift-ideas/#randy      Cara, Len and Randy
       https://lenbeasley.com/gift-ideas/#don-meany  Cara, Len and Don Meany
       https://lenbeasley.com/gift-ideas/#all        every list

   Capitals, spaces and punctuation are ignored, so #Randy, #DonMeany
   and #don-meany all work. Nothing is remembered: each address shows
   what its ending asks for.
   This only keeps the lists out of sight. They are still in this file.
   ====================================================================== */

(function () {
  "use strict";
  var SVG = "http://www.w3.org/2000/svg";

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function icon(paths, cls) {
    var s = document.createElementNS(SVG, "svg");
    s.setAttribute("viewBox", "0 0 20 20");
    s.setAttribute("fill", "none");
    s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "1.7");
    s.setAttribute("stroke-linecap", "round");
    s.setAttribute("stroke-linejoin", "round");
    s.setAttribute("aria-hidden", "true");
    if (cls) s.setAttribute("class", cls);
    paths.forEach(function (d) {
      var p = document.createElementNS(SVG, "path");
      p.setAttribute("d", d);
      s.appendChild(p);
    });
    return s;
  }
  var ARROW = ["M4 10h11", "M11 6l4 4-4 4"];
  var SEARCH = ["M13.25 8.5a4.75 4.75 0 1 1-9.5 0 4.75 4.75 0 0 1 9.5 0z", "M12 12l4 4"];
  var GIFT = ["M3.5 9.5h13v7h-13z", "M2.5 6.5h15v3h-15z", "M10 6.5v10", "M10 6.5c-1.2-3-5-3-4 0", "M10 6.5c1.2-3 5-3 4 0"];

  function slug(s) {
    return String(s).toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
  }
  function shopLink(href, cls, label, name, paths, iconFirst) {
    var a = el("a", { href: href, target: "_blank", rel: "noopener noreferrer", class: "btn " + cls });
    var text = el("span", { text: label });
    var sr = el("span", { class: "sr", text: ": " + name + " (opens in a new tab)" });
    if (iconFirst) { a.appendChild(icon(paths)); a.appendChild(text); }
    else { a.appendChild(text); a.appendChild(icon(paths)); }
    a.appendChild(sr);
    return a;
  }
  function card(g) {
    var q = encodeURIComponent(g.name);
    var media = el("div", { class: "media" });
    if (g.image) {
      var img = el("img", { src: g.image, alt: g.alt || "", loading: "lazy", decoding: "async", referrerpolicy: "no-referrer" });
      media.classList.add("has-img");
      img.addEventListener("error", function () { media.classList.remove("has-img"); img.replaceWith(icon(GIFT, "ph")); });
      media.appendChild(img);
    } else {
      media.appendChild(icon(GIFT, "ph"));
    }
    var body = el("div", { class: "body" }, [el("h3", { text: g.name })]);
    if (g.price) body.appendChild(el("p", { class: "price" }, [el("span", { class: "sr", text: "Price range: " }), document.createTextNode(g.price)]));
    if (g.note) body.appendChild(el("p", { class: "note", text: g.note }));
    var links = [];
    if (g.link && g.link.url) links.push(shopLink(g.link.url, "btn-solid", g.link.label || "Shop", g.name, ARROW, false));
    if (g.amazon !== false) links.push(shopLink(g.amazon || "https://www.amazon.com/s?k=" + q, links.length ? "btn-line" : "btn-solid", "Amazon", g.name, ARROW, false));
    if (g.google !== false) links.push(shopLink(g.google || "https://www.google.com/search?udm=28&q=" + q, "btn-line", "Google Shopping", g.name, SEARCH, true));
    body.appendChild(el("div", { class: "links" }, links));
    /* Name comes first in the DOM; CSS places the image above it visually. */
    return el("li", {}, [el("article", { class: "card" }, [body, media])]);
  }

  var tablist = document.getElementById("tabs");
  var panels = document.getElementById("panels");
  var heading = document.getElementById("lists-heading");
  var tabs = [];

  function norm(v) { return String(v).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ""); }
  function hashKey() {
    var h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) {}
    return norm(h);
  }

  /* Reads the address ending and draws the tabs it asks for. */
  function build() {
    var key = hashKey();
    var all = key === "all";
    tablist.textContent = "";
    panels.textContent = "";
    tabs = [];
    var used = {};
    var start = 0;
    LISTS.filter(function (list) {
      return !list.private || all || norm(list.person) === key;
    }).forEach(function (list, i) {
      var id = slug(list.person) || "list-" + (i + 1);
      while (used[id]) id += "-" + (i + 1);
      used[id] = true;
      if (key && norm(list.person) === key) start = i;

      var tab = el("button", { type: "button", role: "tab", id: "tab-" + id, "aria-controls": id, "aria-selected": "false", tabindex: "-1", text: list.person });
      var panel = el("div", { role: "tabpanel", id: id, "aria-labelledby": "tab-" + id, hidden: "" });
      if (list.gifts && list.gifts.length) {
        panel.appendChild(el("ul", { class: "grid" }, list.gifts.map(card)));
      } else {
        panel.setAttribute("tabindex", "0");
        panel.appendChild(el("p", { class: "empty", text: "No ideas here yet." }));
      }
      tab.addEventListener("click", function () { select(i, false); });
      tab.addEventListener("keydown", function (e) {
        var n = tabs.length, next = null;
        if (e.key === "ArrowRight") next = (i + 1) % n;
        else if (e.key === "ArrowLeft") next = (i - 1 + n) % n;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = n - 1;
        if (next === null) return;
        e.preventDefault();
        select(next, true);
      });
      tablist.appendChild(tab);
      panels.appendChild(panel);
      tabs.push({ tab: tab, panel: panel, id: id });
    });
    if (tabs.length) select(start, false);
  }

  /* Switching tabs leaves the address alone, so a shared link keeps its tabs on reload. */
  function select(index, focus) {
    tabs.forEach(function (t, j) {
      var on = j === index;
      t.tab.setAttribute("aria-selected", on ? "true" : "false");
      t.tab.setAttribute("tabindex", on ? "0" : "-1");
      t.panel.hidden = !on;
    });
    heading.textContent = tabs[index].tab.textContent;
    if (focus) tabs[index].tab.focus();
  }

  build();
  window.addEventListener("hashchange", build);

  /* Theme: "system" removes the override so the browser/OS setting applies. */
  var picker = document.getElementById("theme");
  var root = document.documentElement;
  picker.value = root.getAttribute("data-theme") || "system";
  picker.addEventListener("change", function () {
    var v = picker.value;
    if (v === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", v);
    try {
      if (v === "system") localStorage.removeItem("gift-theme"); else localStorage.setItem("gift-theme", v);
    } catch (e) {}
  });
})();
</script>
</body>
</html>
